<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luyện Đàn Piano Thân Thiện</title>
  <!-- Font chữ rõ nét, thân thiện với người lớn tuổi -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Thư viện JSZip để đọc trực tiếp file .mxl nén của MuseScore -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-main: #F6EFE2;        /* Vàng kem ấm dịu mắt */
      --bg-panel: #EADBC8;       /* Nâu sữa nhạt */
      --bg-card: #FDF9F1;        /* Kem sáng */
      --border-color: #C7B299;   /* Viền nâu nhạt */
      --text-main: #3E2723;      /* Nâu cà phê đậm */
      --text-muted: #6D4C41;     /* Nâu vừa */
      --accent-primary: #8D4E2A; /* Nâu đồng ấm */
      --accent-hover: #6F3B1E;
      --rh-color: #1F7A68;       /* Xanh ngọc trầm - Tay phải */
      --lh-color: #D97724;       /* Cam hổ phách ấm - Tay trái */
      --active-phrase: #D4E6D9;  /* Xanh lá nhạt khi chọn câu */
      --active-border: #2E7D32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      font-family: 'Lexend', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 18px;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Thanh điều khiển trên cùng */
    header {
      background-color: var(--bg-panel);
      border-bottom: 2px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
      flex-shrink: 0;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    label {
      font-weight: 600;
      font-size: 16px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    select, input[type="text"], input[type="number"] {
      font-family: 'Lexend', sans-serif;
      font-size: 17px;
      font-weight: 500;
      color: var(--text-main);
      background-color: #FFFDF9;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
    }

    select:focus, input:focus {
      border-color: var(--accent-primary);
    }

    button {
      font-family: 'Lexend', sans-serif;
      font-size: 17px;
      font-weight: 600;
      color: #FFF;
      background-color: var(--accent-primary);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.97);
    }

    button.btn-secondary {
      background-color: #E2D1BC;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    button.btn-secondary:hover {
      background-color: #D5C0A7;
    }

    button.btn-play {
      background-color: #2E7D32;
      font-size: 19px;
      padding: 8px 20px;
    }

    button.btn-play.playing {
      background-color: #C62828;
    }

    button.btn-small-corner {
      font-size: 14px;
      padding: 5px 10px;
      background-color: #DFCCB5;
      color: var(--text-muted);
    }

    .value-badge {
      font-weight: 700;
      font-size: 18px;
      min-width: 85px;
      text-align: center;
      color: var(--text-main);
    }

    /* Khu vực chọn câu nhạc (Loop Phrases) */
    .phrase-bar {
      background-color: #EFE5D4;
      border-bottom: 2px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .phrase-list {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .phrase-chip {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.25;
    }

    .phrase-chip small {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .phrase-chip.selected {
      background-color: var(--active-phrase);
      border-color: var(--active-border);
      color: #1B5E20;
    }

    .song-info-banner {
      margin-left: auto;
      font-size: 15px;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 14px;
    }

    /* Khu vực màn hình Synthesia + Bàn phím Piano */
    .stage-container {
      flex: 1;
      min-height: 0;
      position: relative;
      background-color: #EDE2D0;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Bảng hiển thị đếm nhịp chờ (Count-in Overlay) */
    #countInOverlay {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(62, 39, 35, 0.92);
      color: #FFF8E7;
      padding: 22px 44px;
      border-radius: 18px;
      font-size: 36px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      display: none;
      pointer-events: none;
      z-index: 20;
    }

    /* Chú thích màu 2 tay trên góc màn hình */
    .hand-legend {
      position: absolute;
      top: 12px;
      left: 16px;
      background: rgba(253, 249, 241, 0.92);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      display: flex;
      gap: 16px;
      font-size: 16px;
      font-weight: 600;
      pointer-events: none;
      z-index: 5;
    }

    .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* Hộp thoại Cài đặt (Modal) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(45, 30, 24, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-main);
      border: 3px solid var(--border-color);
      border-radius: 16px;
      width: 92%;
      max-width: 680px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .setting-row {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .setting-row-inline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pattern-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 16px;
    }

    .pattern-table th, .pattern-table td {
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      text-align: left;
    }

    .pattern-table th {
      background: var(--bg-panel);
    }
  </style>
</head>
<body>

  <!-- THANH ĐIỀU KHIỂN CHÍNH -->
  <header>
    <!-- Chọn bài nhạc + Nút nhỏ mở thư mục ở góc -->
    <div class="control-group">
      <label for="songSelect">🎵 Bài nhạc:</label>
      <select id="songSelect" style="min-width: 220px;"></select>
      <button class="btn-secondary btn-small-corner" id="btnOpenFolder" title="Mở thư mục hoặc chọn file .mxl / .xml từ máy tính">
        📁 Mở file / Thư mục
      </button>
      <input type="file" id="fileInput" multiple accept=".xml,.musicxml,.mxl" style="display:none;" />
    </div>

    <!-- Nút Phát / Tạm dừng / Tập lại -->
    <div class="control-group">
      <button class="btn-play" id="btnPlayPause" title="Nhấn phím Space (Dấu cách) để Bắt đầu / Tạm dừng">▶ Bắt đầu</button>
      <button class="btn-secondary" id="btnRestart">⏮ Đầu câu</button>
    </div>

    <!-- Chỉnh tốc độ (Tempo) bằng nút Cộng/Trừ giá trị BPM -->
    <div class="control-group">
      <label>⏱ Tốc độ:</label>
      <button class="btn-secondary" id="btnTempoDown">- 5</button>
      <span class="value-badge" id="tempoDisplay">75 BPM</span>
      <button class="btn-secondary" id="btnTempoUp">+ 5</button>
    </div>

    <!-- Chọn kiểu rải hợp âm tay trái -->
    <div class="control-group" id="patternControlGroup">
      <label for="patternSelect">🎹 Rải tay trái:</label>
      <select id="patternSelect" style="max-width: 310px;"></select>
    </div>

    <!-- Đổi Tone (Transpose) -->
    <div class="control-group">
      <label>🎼 Tone:</label>
      <button class="btn-secondary" id="btnTransposeDown">-1</button>
      <span class="value-badge" id="transposeDisplay" style="min-width: 135px;">Tone: C</span>
      <button class="btn-secondary" id="btnTransposeUp">+1</button>
      <button id="btnAutoWhiteKeys" title="Tự động dịch bài nhạc về Tone Đô Trưởng / La Thứ (toàn phím trắng)">
        Về Tone C/Am
      </button>
    </div>

    <!-- Nút mở bảng Cài Đặt -->
    <button class="btn-secondary" id="btnOpenSettings">⚙️ Cài đặt</button>
  </header>

  <!-- THANH CHỌN CÂU NHẠC ĐỂ LẶP (LOOP PHRASES) -->
  <div class="phrase-bar">
    <button class="btn-secondary" id="btnSelectAllPhrases" style="padding: 5px 12px; font-size: 15px;">Chọn cả bài</button>
    <button class="btn-secondary" id="btnClearPhrases" style="padding: 5px 12px; font-size: 15px;">Xóa chọn</button>
    <div class="phrase-list" id="phraseList"></div>

    <div class="song-info-banner" id="songInfoBanner">
      <span id="infoMeter">Nhịp: --</span>
      <span id="infoMode">Chế độ: --</span>
      <span id="infoSplitMode">Tách câu: --</span>
    </div>
  </div>

  <!-- MÀN HÌNH NỐT RƠI (SYNTHESIA) & BÀN PHÍM PIANO -->
  <div class="stage-container" id="stageContainer">
    <div class="hand-legend">
      <div><span class="dot" style="background: var(--rh-color);"></span>Tay Phải (Giai điệu)</div>
      <div><span class="dot" style="background: var(--lh-color);"></span>Tay Trái (Hợp âm / Đệm)</div>
    </div>
    <div id="countInOverlay">Chuẩn bị: 4</div>
    <canvas id="pianoCanvas"></canvas>
  </div>

  <!-- HỘP THOẠI CÀI ĐẶT (SETTINGS MODAL) -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>⚙️ Cài đặt luyện tập & Mẫu rải hợp âm</h2>
        <button class="btn-secondary" id="btnCloseSettings">Đóng ✕</button>
      </div>

      <!-- Cài đặt 1: Chọn tay tập -->
      <div class="setting-row">
        <div class="setting-row-inline">
          <label for="handModeSelect">🖐 Chế độ phát & hiển thị tay:</label>
          <select id="handModeSelect">
            <option value="both">Cả 2 tay (Tay Phải + Tay Trái)</option>
            <option value="rh">Chỉ Tay Phải (Tập giai điệu)</option>
            <option value="lh">Chỉ Tay Trái (Tập rải hợp âm)</option>
          </select>
        </div>
      </div>

      <!-- Cài đặt 2: Số nhịp đếm chờ giữa các vòng lặp -->
      <div class="setting-row">
        <div class="setting-row-inline">
          <label for="countInInput">⏳ Số nhịp đếm chờ (Count-in) trước khi lặp lại câu:</label>
          <div style="display:flex; align-items:center; gap:8px;">
            <button class="btn-secondary" id="btnCountInMinus">-</button>
            <input type="number" id="countInInput" min="0" max="16" value="3" style="width: 75px; text-align:center;" />
            <button class="btn-secondary" id="btnCountInPlus">+</button>
            <span>nhịp</span>
          </div>
        </div>
      </div>

      <!-- Cài đặt 3: Hiển thị tên nốt -->
      <div class="setting-row">
        <div class="setting-row-inline">
          <label for="noteLabelSelect">🔤 Kiểu hiển thị tên nốt trên thanh rơi & phím đàn:</label>
          <select id="noteLabelSelect">
            <option value="solfege">Đô - Rê - Mi - Fa - Sol - La - Si</option>
            <option value="letter">C - D - E - F - G - A - B</option>
          </select>
        </div>
      </div>

      <!-- Cài đặt 4: Thêm / Quản lý quy tắc rải hợp âm -->
      <div class="setting-row">
        <label>➕ Tự thêm quy tắc rải hợp âm mới (Không giới hạn số nốt):</label>
        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;">
          <input type="text" id="newPatternNotes" placeholder="Nhập chuỗi bậc, VD: 1-5-8-5-3-5-8-5" style="flex: 2; min-width: 210px;" />
          <input type="text" id="newPatternMeters" placeholder="Gợi ý nhịp, VD: 4/4, 2/4" style="flex: 1; min-width: 140px;" />
          <button id="btnAddPattern">Thêm mẫu</button>
        </div>
        <small style="color: var(--text-muted);">
          Quy ước: <b>1</b> = Chủ âm, <b>3</b> = Bậc 3, <b>5</b> = Bậc 5, <b>8</b> = Chủ âm cao hơn 1 quãng tám. Mỗi nốt ứng với 1 phách.
        </small>

        <table class="pattern-table" id="patternTable">
          <thead>
            <tr>
              <th>Tên & Chuỗi bậc</th>
              <th>Gợi ý nhịp</th>
              <th>Xóa</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    /********************************************************************
     * 1. DANH SÁCH FILE MẶC ĐỊNH & MA TRẬN RẢI HỢP ÂM DỰ PHÒNG
     ********************************************************************/
    const DEFAULT_SONG_FILES = [
      "viet-nam-toi.mxl",
      "tien-quan-ca-quoc-ca.mxl",
      "fur-elise-easy-ver.mxl"
    ];

    const FALLBACK_PATTERNS = [
      { id: "p1",  name: "Mẫu 1: 1 – 3 – 5 – 3",         notes: [1, 3, 5, 3],       suggestedMeters: ["2/4", "4/4"], hint: "Nhịp 2/4, 4/4" },
      { id: "p2",  name: "Mẫu 2: 1 – 5 – 3 – 5",         notes: [1, 5, 3, 5],       suggestedMeters: ["2/4", "4/4"], hint: "Nhịp 2/4, 4/4" },
      { id: "p3",  name: "Mẫu 3: 1 – 5 – 8 – 5",         notes: [1, 5, 8, 5],       suggestedMeters: ["2/4", "4/4"], hint: "Nhịp 2/4, 4/4" },
      { id: "p4",  name: "Mẫu 4: 1 – 3 – 5 – 8",         notes: [1, 3, 5, 8],       suggestedMeters: ["2/4", "4/4"], hint: "Nhịp 2/4, 4/4" },
      { id: "p5",  name: "Mẫu 5: 1 – 5 – 8 – 3",         notes: [1, 5, 8, 3],       suggestedMeters: ["2/4", "4/4"], hint: "Nhịp 2/4, 4/4" },
      { id: "p6",  name: "Mẫu 6: 1 – 3 – 8 – 5",         notes: [1, 3, 8, 5],       suggestedMeters: ["2/4", "4/4"], hint: "Nhịp 2/4, 4/4" },
      { id: "p7",  name: "Mẫu 7: 1 – 5 – 3 – 8",         notes: [1, 5, 3, 8],       suggestedMeters: ["2/4", "4/4"], hint: "Nhịp 2/4, 4/4" },
      { id: "p8",  name: "Mẫu 8: 1 – 5 – 8 – 3 – 5",     notes: [1, 5, 8, 3, 5],    suggestedMeters: ["4/4", "3/4"], hint: "Nhịp 4/4, 3/4" },
      { id: "p9",  name: "Mẫu 9: 1 – 3 – 5 – 8 – 5 – 3", notes: [1, 3, 5, 8, 5, 3], suggestedMeters: ["3/4", "6/8"], hint: "Nhịp 3/4, 6/8" },
      { id: "p10", name: "Mẫu 10: 1 – 5 – 3 – 5 – 8 – 5",notes: [1, 5, 3, 5, 8, 5], suggestedMeters: ["3/4", "6/8"], hint: "Nhịp 3/4, 6/8" }
    ];

    /********************************************************************
     * 2. BẢNG TRA CỨU NHẠC LÝ & TÊN NỐT
     ********************************************************************/
    const STEP_TO_SEMITONE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    const SEMITONE_TO_LETTER = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
    const SEMITONE_TO_SOLFEGE = ["Đô", "Đô#", "Rê", "Mib", "Mi", "Fa", "Fa#", "Sol", "Lab", "La", "Sib", "Si"];

    // Từ số dấu hóa (fifths: -7 đến +7) suy ra số bán cung của chủ âm Trưởng (Major Root)
    const FIFTHS_TO_TONIC_PC = {
      "-7": 11, "-6": 6, "-5": 1, "-4": 8, "-3": 3, "-2": 10, "-1": 5,
      "0": 0, "1": 7, "2": 2, "3": 9, "4": 4, "5": 11, "6": 6, "7": 1
    };

    /********************************************************************
     * 3. BIẾN TRẠNG THÁI TOÀN CỤC (APPLICATION STATE)
     ********************************************************************/
    let patterns = [];
    let currentPatternId = "p1";
    let localFilesMap = new Map(); // Lưu File object nếu người dùng mở từ ổ cứng PC

    let songData = null;           // Dữ liệu bài hát gốc sau khi đọc XML/MXL
    let activeNotes = [];          // Toàn bộ nốt (Tay phải + Tay trái) sau khi tính hợp âm & transpose
    let phrases = [];              // Danh sách các câu nhạc [{ index, startBeat, endBeat, label }]
    let selectedPhraseIndices = new Set();

    // Điều khiển phát nhạc
    let isPlaying = false;
    let currentBpm = 75;
    let currentBeat = 0;
    let transposeSemitones = 0;
    let handMode = localStorage.getItem("piano_handMode") || "both";
    let countInBeatsSetting = parseInt(localStorage.getItem("piano_countIn") ?? "3", 10);
    let noteLabelMode = localStorage.getItem("piano_noteLabel") || "solfege";

    // Trạng thái đếm nhịp chờ (Count-in) giữa các vòng lặp
    let isCountingIn = false;
    let countInRemainingBeats = 0;
    let lastCountInInt = -1;

    // Web Audio API
    let audioCtx = null;
    let triggeredNotesSet = new Set();
    let lastFrameTime = 0;

    /********************************************************************
     * 4. BỘ PHÁT ÂM THANH PIANO ẤM ÁP (WEB AUDIO SYNTH)
     ********************************************************************/
    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playPianoNote(midi, durationSec, hand) {
      if (!audioCtx) return;
      if (handMode === "rh" && hand === "lh") return;
      if (handMode === "lh" && hand === "rh") return;

      const now = audioCtx.currentTime;
      const freq = 440 * Math.pow(2, (midi - 69) / 12);

      const masterGain = audioCtx.createGain();
      const maxGain = hand === "rh" ? 0.28 : 0.17;
      masterGain.gain.setValueAtTime(0.001, now);
      masterGain.gain.linearRampToValueAtTime(maxGain, now + 0.015);
      masterGain.gain.exponentialRampToValueAtTime(maxGain * 0.4, now + 0.25);
      masterGain.gain.exponentialRampToValueAtTime(0.0008, now + Math.max(durationSec, 0.35) + 0.15);

      const osc1 = audioCtx.createOscillator();
      osc1.type = "triangle";
      osc1.frequency.setValueAtTime(freq, now);

      const osc2 = audioCtx.createOscillator();
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(freq * 2, now);
      const gain2 = audioCtx.createGain();
      gain2.gain.setValueAtTime(0.18, now);

      osc1.connect(masterGain);
      osc2.connect(gain2);
      gain2.connect(masterGain);
      masterGain.connect(audioCtx.destination);

      const stopTime = now + Math.max(durationSec, 0.35) + 0.2;
      osc1.start(now);
      osc2.start(now);
      osc1.stop(stopTime);
      osc2.stop(stopTime);
    }

    function playMetronomeTick(isAccent = false) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(isAccent ? 880 : 620, now);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    }

    /********************************************************************
     * 5. NẠP MA TRẬN RẢI HỢP ÂM (patterns.json + LocalStorage)
     ********************************************************************/
    async function loadPatterns() {
      let basePatterns = [...FALLBACK_PATTERNS];
      try {
        const res = await fetch("patterns.json", { cache: "no-store" });
        if (res.ok) {
          const json = await res.json();
          if (Array.isArray(json) && json.length > 0) {
            basePatterns = json;
          }
        }
      } catch (e) {}

      const customSaved = localStorage.getItem("piano_customPatterns");
      if (customSaved) {
        try {
          const parsed = JSON.parse(customSaved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            basePatterns = parsed;
          }
        } catch (err) {}
      }
      patterns = basePatterns;
      renderPatternSelect();
      renderPatternTable();
    }

    function savePatternsToLocal() {
      localStorage.setItem("piano_customPatterns", JSON.stringify(patterns));
      renderPatternSelect();
      renderPatternTable();
      rebuildActiveNotes();
    }

    function renderPatternSelect() {
      const select = document.getElementById("patternSelect");
      select.innerHTML = "";
      const currentMeter = songData ? `${songData.beats}/${songData.beatType}` : "";

      patterns.forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p.id;
        const isRecommended = currentMeter && Array.isArray(p.suggestedMeters) && p.suggestedMeters.includes(currentMeter);
        const badge = isRecommended ? "⭐ [Phù hợp nhịp bài này] " : "";
        const hintText = p.hint ? ` (${p.hint})` : (p.suggestedMeters ? ` (Gợi ý: ${p.suggestedMeters.join(", ")})` : "");
        opt.textContent = `${badge}${p.name}${hintText}`;
        select.appendChild(opt);
      });

      if (patterns.some((p) => p.id === currentPatternId)) {
        select.value = currentPatternId;
      } else if (patterns.length > 0) {
        currentPatternId = patterns[0].id;
        select.value = currentPatternId;
      }
    }

    function renderPatternTable() {
      const tbody = document.querySelector("#patternTable tbody");
      tbody.innerHTML = "";
      patterns.forEach((p) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><b>${p.name}</b><br/><small>Chuỗi bậc: ${p.notes.join(" – ")}</small></td>
          <td>${(p.suggestedMeters || []).join(", ") || "Mọi loại nhịp"}</td>
          <td><button class="btn-secondary" data-del="${p.id}" style="padding:4px 10px; font-size:14px;">Xóa</button></td>
        `;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll("button[data-del]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (patterns.length <= 1) {
            alert("Cần giữ lại ít nhất 1 mẫu rải hợp âm!");
            return;
          }
          const id = btn.getAttribute("data-del");
          patterns = patterns.filter((item) => item.id !== id);
          savePatternsToLocal();
        });
      });
    }

    /********************************************************************
     * 6. TỰ ĐỘNG QUÉT FILE .MXL / .XML CÙNG THƯ MỤC (GITHUB & LOCAL)
     ********************************************************************/
    async function initSongList() {
      const discoveredFiles = new Set(DEFAULT_SONG_FILES);

      if (window.location.hostname.endsWith("github.io")) {
        try {
          const owner = window.location.hostname.split(".")[0];
          const pathParts = window.location.pathname.split("/").filter(Boolean);
          if (pathParts.length > 0 && pathParts[pathParts.length - 1].includes(".")) {
            pathParts.pop();
          }
          if (pathParts.length >= 1) {
            const repo = pathParts[0];
            const dirPath = pathParts.slice(1).join("/");
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${dirPath}`;
            const res = await fetch(apiUrl);
            if (res.ok) {
              const items = await res.json();
              if (Array.isArray(items)) {
                items.forEach((item) => {
                  if (item.type === "file" && /\.(mxl|xml|musicxml)$/i.test(item.name)) {
                    discoveredFiles.add(item.name);
                  }
                });
              }
            }
          }
        } catch (err) {
          console.warn("Không thể quét tự động qua GitHub API, dùng danh sách mặc định:", err);
        }
      }

      populateSongSelect(Array.from(discoveredFiles));
      if (discoveredFiles.size > 0) {
        loadSelectedSong(Array.from(discoveredFiles)[0]);
      }
    }

    function populateSongSelect(fileNames) {
      const select = document.getElementById("songSelect");
      select.innerHTML = "";
      fileNames.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    /********************************************************************
     * 7. GIẢI NÉN FILE .MXL HOẶC ĐỌC FILE .XML TRỰC TIẾP
     ********************************************************************/
    async function extractXmlStringFromBuffer(arrayBuffer, fileName) {
      const isMxl = fileName.toLowerCase().endsWith(".mxl");
      const uint8 = new Uint8Array(arrayBuffer);
      const isZipHeader = uint8.length > 4 && uint8[0] === 0x50 && uint8[1] === 0x4B;

      if (isMxl || isZipHeader) {
        const zip = await JSZip.loadAsync(arrayBuffer);
        let rootFilePath = null;

        if (zip.file("META-INF/container.xml")) {
          const containerText = await zip.file("META-INF/container.xml").async("string");
          const parser = new DOMParser();
          const containerDoc = parser.parseFromString(containerText, "application/xml");
          const rootFileEl = containerDoc.querySelector("rootfile");
          if (rootFileEl && rootFileEl.getAttribute("full-path")) {
            rootFilePath = rootFileEl.getAttribute("full-path");
          }
        }

        if (!rootFilePath || !zip.file(rootFilePath)) {
          const candidates = Object.keys(zip.files).filter(
            (path) => !path.startsWith("META-INF") && /\.(xml|musicxml)$/i.test(path)
          );
          if (candidates.length > 0) rootFilePath = candidates[0];
        }

        if (!rootFilePath || !zip.file(rootFilePath)) {
          throw new Error("Không tìm thấy dữ liệu MusicXML bên trong file .mxl!");
        }
        return await zip.file(rootFilePath).async("string");
      } else {
        const decoder = new TextDecoder("utf-8");
        return decoder.decode(arrayBuffer);
      }
    }

    async function loadSelectedSong(fileName) {
      stopPlayback();
      try {
        let arrayBuffer;
        if (localFilesMap.has(fileName)) {
          arrayBuffer = await localFilesMap.get(fileName).arrayBuffer();
        } else {
          const response = await fetch(encodeURI(fileName));
          if (!response.ok) {
            throw new Error(`Không tải được file "${fileName}". Nếu bạn đang mở trực tiếp trên máy tính (file://), hãy bấm nút "📁 Mở file / Thư mục" ở góc trái để chọn file.`);
          }
          arrayBuffer = await response.arrayBuffer();
        }

        const xmlText = await extractXmlStringFromBuffer(arrayBuffer, fileName);
        parseMusicXML(xmlText, fileName);
      } catch (err) {
        alert(err.message);
      }
    }

    /********************************************************************
     * 8. BỘ PHÂN TÍCH MUSICXML & XỬ LÝ LỜI 1 / LỜI 2
     ********************************************************************/
    function parseMusicXML(xmlText, fileName) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "application/xml");

      const parts = Array.from(xmlDoc.querySelectorAll("part"));
      if (parts.length === 0) {
        alert("File không đúng chuẩn MusicXML!");
        return;
      }

      const stavesEl = xmlDoc.querySelector("attributes > staves");
      const numStaves = stavesEl ? parseInt(stavesEl.textContent.trim(), 10) : 1;
      const isTwoHandPianoSheet = numStaves >= 2 || parts.length >= 2;

      let divisions = 1;
      let fifths = 0;
      let beats = 4;
      let beatType = 4;
      let detectedTempo = 75;

      const soundTempoEl = xmlDoc.querySelector("sound[tempo]");
      if (soundTempoEl) {
        const t = parseFloat(soundTempoEl.getAttribute("tempo"));
        if (!isNaN(t) && t > 20 && t < 260) detectedTempo = Math.round(t);
      }

      const rawRightNotes = [];
      const rawLeftNotes = [];
      const rawRests = [];
      const measuresInfo = [];

      let globalQuarterCursor = 0;
      const measureEls = Array.from(parts[0].querySelectorAll("measure"));
      const tiedNoteMap = new Map();

      measureEls.forEach((measureEl, mIdx) => {
        const measureStartQuarter = globalQuarterCursor;
        let localDivCursor = 0;
        let maxLocalDivCursor = 0;
        const measureHarmonies = [];

        Array.from(measureEl.children).forEach((child) => {
          const tag = child.tagName;

          if (tag === "attributes") {
            const divEl = child.querySelector("divisions");
            if (divEl) divisions = Math.max(1, parseInt(divEl.textContent.trim(), 10));
            const fifthsEl = child.querySelector("key > fifths");
            if (fifthsEl) fifths = parseInt(fifthsEl.textContent.trim(), 10);
            const beatsEl = child.querySelector("time > beats");
            const beatTypeEl = child.querySelector("time > beat-type");
            if (beatsEl && beatTypeEl) {
              beats = parseInt(beatsEl.textContent.trim(), 10);
              beatType = parseInt(beatTypeEl.textContent.trim(), 10);
            }
          } else if (tag === "backup") {
            const dur = parseInt(child.querySelector("duration")?.textContent || "0", 10);
            localDivCursor = Math.max(0, localDivCursor - dur);
          } else if (tag === "forward") {
            const dur = parseInt(child.querySelector("duration")?.textContent || "0", 10);
            localDivCursor += dur;
            if (localDivCursor > maxLocalDivCursor) maxLocalDivCursor = localDivCursor;
          } else if (tag === "harmony") {
            const rootStep = child.querySelector("root > root-step")?.textContent.trim();
            const rootAlter = parseInt(child.querySelector("root > root-alter")?.textContent || "0", 10);
            const kindText = (child.querySelector("kind")?.textContent || "major").trim().toLowerCase();
            if (rootStep && STEP_TO_SEMITONE[rootStep] !== undefined) {
              const rootPc = (STEP_TO_SEMITONE[rootStep] + rootAlter + 12) % 12;
              const isMinor = kindText.includes("minor") && !kindText.includes("major");
              const isDim = kindText.includes("diminished");
              const offsetQuarter = localDivCursor / divisions;
              measureHarmonies.push({
                startQuarter: measureStartQuarter + offsetQuarter,
                rootPc,
                quality: isDim ? "dim" : (isMinor ? "minor" : "major"),
                label: `${rootStep}${rootAlter === 1 ? "#" : (rootAlter === -1 ? "b" : "")}${isMinor ? "m" : ""}`
              });
            }
          } else if (tag === "note") {
            const isGrace = child.querySelector("grace") !== null;
            if (isGrace) return;

            const isChord = child.querySelector("chord") !== null;
            const durDiv = parseInt(child.querySelector("duration")?.textContent || "0", 10);
            const durQuarter = durDiv / divisions;
            const staffNum = parseInt(child.querySelector("staff")?.textContent || "1", 10);

            const noteStartDiv = isChord ? Math.max(0, localDivCursor - durDiv) : localDivCursor;
            const noteStartQuarter = measureStartQuarter + (noteStartDiv / divisions);

            const isRest = child.querySelector("rest") !== null;

            if (isRest) {
              if (staffNum === 1) {
                rawRests.push({
                  startQuarter: noteStartQuarter,
                  durationQuarter: durQuarter,
                  measureIndex: mIdx
                });
              }
            } else {
              const step = child.querySelector("pitch > step")?.textContent.trim() || "C";
              const alter = parseInt(child.querySelector("pitch > alter")?.textContent || "0", 10);
              const octave = parseInt(child.querySelector("pitch > octave")?.textContent || "4", 10);
              const midi = (octave + 1) * 12 + STEP_TO_SEMITONE[step] + alter;

              // Đọc từng lời bài hát riêng biệt (Lời 1, Lời 2...) thay vì gộp chung
              const lyricEls = Array.from(child.querySelectorAll("lyric"));
              const lyricsByVerse = {};
              lyricEls.forEach((lEl, idx) => {
                const numAttr = lEl.getAttribute("number") || String(idx + 1);
                const t = lEl.querySelector("text")?.textContent.trim() || "";
                if (t) {
                  lyricsByVerse[numAttr] = lyricsByVerse[numAttr]
                    ? `${lyricsByVerse[numAttr]} ${t}`
                    : t;
                }
              });

              const tieEls = Array.from(child.querySelectorAll("tie, notations > tied"));
              const hasTieStart = tieEls.some((el) => el.getAttribute("type") === "start");
              const hasTieStop = tieEls.some((el) => el.getAttribute("type") === "stop");

              const tieKey = `${staffNum}_${midi}`;

              if (hasTieStop && tiedNoteMap.has(tieKey)) {
                const prevNote = tiedNoteMap.get(tieKey);
                prevNote.durationQuarter += durQuarter;
                // Nếu nốt nối có đính kèm lyric bổ sung thì ghép vào đúng verse
                Object.keys(lyricsByVerse).forEach((vKey) => {
                  if (!prevNote.lyricsByVerse[vKey]) {
                    prevNote.lyricsByVerse[vKey] = lyricsByVerse[vKey];
                  }
                });
                if (!hasTieStart) tiedNoteMap.delete(tieKey);
              } else {
                const noteObj = {
                  midi,
                  startQuarter: noteStartQuarter,
                  durationQuarter: durQuarter,
                  measureIndex: mIdx,
                  lyricsByVerse,
                  lyric: "", // Sẽ được gán sau khi phân tích nửa đầu (Lời 1) / nửa sau (Lời 2)
                  hand: staffNum === 1 ? "rh" : "lh"
                };
                if (staffNum === 1) {
                  rawRightNotes.push(noteObj);
                } else {
                  rawLeftNotes.push(noteObj);
                }
                if (hasTieStart) {
                  tiedNoteMap.set(tieKey, noteObj);
                }
              }
            }

            if (!isChord) {
              localDivCursor += durDiv;
              if (localDivCursor > maxLocalDivCursor) maxLocalDivCursor = localDivCursor;
            }
          }
        });

        const expectedMeasureQuarters = (beats * 4) / beatType;
        const actualMeasureQuarters = maxLocalDivCursor > 0 ? (maxLocalDivCursor / divisions) : expectedMeasureQuarters;

        measuresInfo.push({
          index: mIdx,
          startQuarter: measureStartQuarter,
          durationQuarter: actualMeasureQuarters,
          beats,
          beatType,
          harmonies: measureHarmonies
        });

        globalQuarterCursor += actualMeasureQuarters;
      });

      // Xử lý hiển thị Lời 1 ở nửa bài đầu, Lời 2 ở nửa bài sau (nếu bài có 2 lời)
      const halfQuarter = globalQuarterCursor / 2;
      const hasSecondVerse = rawRightNotes.some((n) => {
        const keys = Object.keys(n.lyricsByVerse || {});
        return keys.length >= 2 || keys.includes("2");
      });

      rawRightNotes.forEach((n) => {
        const map = n.lyricsByVerse || {};
        const keys = Object.keys(map).sort();
        if (keys.length === 0) {
          n.lyric = "";
        } else if (!hasSecondVerse || keys.length === 1) {
          // Chỉ có 1 lời tại nốt này: nếu nốt nằm ở nửa đầu mà chỉ có lời 2 thì ẩn, ngược lại hiển thị
          const firstKey = keys[0];
          n.lyric = map[firstKey];
        } else {
          // Có từ 2 lời trở lên trên cùng 1 nốt: nửa bài đầu lấy Lời 1, nửa bài sau lấy Lời 2
          if (n.startQuarter < halfQuarter) {
            n.lyric = map["1"] || map[keys[0]] || "";
          } else {
            n.lyric = map["2"] || map[keys[1]] || map[keys[0]] || "";
          }
        }
      });

      // Nếu file có Part thứ 2 riêng biệt cho tay trái
      if (parts.length >= 2 && rawLeftNotes.length === 0) {
        let p2Cursor = 0;
        let p2Divisions = divisions;
        Array.from(parts[1].querySelectorAll("measure")).forEach((mEl, mIdx) => {
          const mStart = p2Cursor;
          let localCur = 0;
          let maxCur = 0;
          Array.from(mEl.children).forEach((ch) => {
            if (ch.tagName === "attributes") {
              const d = ch.querySelector("divisions");
              if (d) p2Divisions = Math.max(1, parseInt(d.textContent.trim(), 10));
            } else if (ch.tagName === "note" && !ch.querySelector("grace")) {
              const isChord = ch.querySelector("chord") !== null;
              const durDiv = parseInt(ch.querySelector("duration")?.textContent || "0", 10);
              const durQ = durDiv / p2Divisions;
              const startDiv = isChord ? Math.max(0, localCur - durDiv) : localCur;
              if (!ch.querySelector("rest")) {
                const step = ch.querySelector("pitch > step")?.textContent.trim() || "C";
                const alter = parseInt(ch.querySelector("pitch > alter")?.textContent || "0", 10);
                const octave = parseInt(ch.querySelector("pitch > octave")?.textContent || "3", 10);
                const midi = (octave + 1) * 12 + STEP_TO_SEMITONE[step] + alter;
                rawLeftNotes.push({
                  midi,
                  startQuarter: mStart + startDiv / p2Divisions,
                  durationQuarter: durQ,
                  measureIndex: mIdx,
                  lyric: "",
                  hand: "lh"
                });
              }
              if (!isChord) {
                localCur += durDiv;
                if (localCur > maxCur) maxCur = localCur;
              }
            }
          });
          p2Cursor += maxCur > 0 ? maxCur / p2Divisions : (beats * 4) / beatType;
        });
      }

      const hasExplicitChords = measuresInfo.some((m) => m.harmonies.length > 0);

      songData = {
        fileName,
        isTwoHandPianoSheet: isTwoHandPianoSheet && rawLeftNotes.length > 0,
        hasExplicitChords,
        fifths,
        beats,
        beatType,
        totalQuarters: globalQuarterCursor,
        rawRightNotes,
        rawLeftNotes,
        rawRests,
        measuresInfo
      };

      currentBpm = detectedTempo;
      transposeSemitones = 0;
      updateTempoDisplay();
      updateTransposeDisplay();

      const patternGroup = document.getElementById("patternControlGroup");
      patternGroup.style.opacity = songData.isTwoHandPianoSheet ? "0.45" : "1";
      document.getElementById("patternSelect").disabled = songData.isTwoHandPianoSheet;

      renderPatternSelect();
      buildPhrases();
      rebuildActiveNotes();
    }

    /********************************************************************
     * 9. THUẬT TOÁN TÁCH CÂU NHẠC (ƯU TIÊN DẤU CHẤM TRONG LỜI BÀI HÁT)
     ********************************************************************/
    function buildPhrases() {
      phrases = [];
      selectedPhraseIndices.clear();
      if (!songData) return;

      const rhNotes = [...songData.rawRightNotes].sort((a, b) => a.startQuarter - b.startQuarter);
      if (rhNotes.length === 0) return;

      const hasLyricsPunctuation = rhNotes.some((n) => n.lyric && /[.?!;…]/.test(n.lyric));
      const cutPoints = [];

      if (hasLyricsPunctuation) {
        rhNotes.forEach((n) => {
          if (n.lyric && /[.?!;…]/.test(n.lyric)) {
            cutPoints.push(n.startQuarter + n.durationQuarter);
          }
        });
      } else {
        const sortedRests = [...songData.rawRests].sort((a, b) => a.startQuarter - b.startQuarter);
        let lastCut = 0;
        sortedRests.forEach((r) => {
          const notesInSegment = rhNotes.filter(
            (n) => n.startQuarter >= lastCut - 0.05 && n.startQuarter < r.startQuarter + 0.05
          );
          if (notesInSegment.length >= 2) {
            const cutAt = r.startQuarter + r.durationQuarter;
            cutPoints.push(cutAt);
            lastCut = cutAt;
          }
        });
      }

      let phraseStart = 0;
      let phraseIdx = 1;

      cutPoints.forEach((cutAt) => {
        if (cutAt - phraseStart >= 0.5) {
          const notesInside = rhNotes.filter(
            (n) => n.startQuarter >= phraseStart - 0.05 && n.startQuarter < cutAt - 0.05
          );
          if (notesInside.length > 0) {
            const lyricPreview = notesInside
              .map((n) => n.lyric)
              .filter(Boolean)
              .join(" ")
              .slice(0, 32);
            phrases.push({
              index: phraseIdx++,
              startQuarter: phraseStart,
              endQuarter: cutAt,
              lyricPreview
            });
            phraseStart = cutAt;
          }
        }
      });

      if (songData.totalQuarters - phraseStart >= 0.5) {
        const remainingNotes = rhNotes.filter((n) => n.startQuarter >= phraseStart - 0.05);
        if (remainingNotes.length > 0) {
          const lyricPreview = remainingNotes
            .map((n) => n.lyric)
            .filter(Boolean)
            .join(" ")
            .slice(0, 32);
          phrases.push({
            index: phraseIdx++,
            startQuarter: phraseStart,
            endQuarter: songData.totalQuarters,
            lyricPreview
          });
        }
      }

      if (phrases.length <= 1 && songData.measuresInfo.length > 4) {
        phrases = [];
        for (let i = 0; i < songData.measuresInfo.length; i += 4) {
          const mStart = songData.measuresInfo[i].startQuarter;
          const mEndObj = songData.measuresInfo[Math.min(i + 3, songData.measuresInfo.length - 1)];
          const mEnd = mEndObj.startQuarter + mEndObj.durationQuarter;
          phrases.push({
            index: phrases.length + 1,
            startQuarter: mStart,
            endQuarter: mEnd,
            lyricPreview: `Ô nhịp ${i + 1} - ${Math.min(i + 4, songData.measuresInfo.length)}`
          });
        }
      }

      phrases.forEach((_, idx) => selectedPhraseIndices.add(idx));

      document.getElementById("infoMeter").textContent = `Nhịp: ${songData.beats}/${songData.beatType}`;
      document.getElementById("infoMode").textContent = songData.isTwoHandPianoSheet
        ? "Sheet Piano 2 tay (Giữ nguyên)"
        : (songData.hasExplicitChords ? "Khóa Sol (Đã có hợp âm)" : "Khóa Sol (Tự suy hợp âm theo Tone)");
      document.getElementById("infoSplitMode").textContent = hasLyricsPunctuation
        ? "Tách câu: Theo dấu chấm lời hát"
        : "Tách câu: Theo khoảng lặng";

      renderPhraseChips();
      resetCursorToFirstSelectedPhrase();
    }

    function renderPhraseChips() {
      const container = document.getElementById("phraseList");
      container.innerHTML = "";
      phrases.forEach((p, idx) => {
        const chip = document.createElement("div");
        chip.className = "phrase-chip" + (selectedPhraseIndices.has(idx) ? " selected" : "");
        chip.innerHTML = `
          <span>Câu ${p.index}</span>
          <small>${p.lyricPreview || `Phách ${Math.round(p.startQuarter + 1)}–${Math.round(p.endQuarter)}`}</small>
        `;
        chip.addEventListener("click", () => {
          if (selectedPhraseIndices.has(idx)) {
            if (selectedPhraseIndices.size > 1) {
              selectedPhraseIndices.delete(idx);
            }
          } else {
            selectedPhraseIndices.add(idx);
          }
          renderPhraseChips();
          resetCursorToFirstSelectedPhrase();
        });
        container.appendChild(chip);
      });
    }

    /********************************************************************
     * 10. SUY RA HỢP ÂM THEO TONE (DIATONIC) & RẢI HỢP ÂM TAY TRÁI
     ********************************************************************/
    function getDiatonicChordFromFirstNote(melodyMidi, fifths) {
      const tonicPc = FIFTHS_TO_TONIC_PC[String(fifths)] ?? 0;
      const scaleIntervals = [0, 2, 4, 5, 7, 9, 11];
      const scalePcs = scaleIntervals.map((iv) => (tonicPc + iv) % 12);

      const notePc = ((melodyMidi % 12) + 12) % 12;
      const degreeIndex = scalePcs.indexOf(notePc);

      if (degreeIndex === 6) {
        return { rootPc: scalePcs[4], quality: "major" };
      } else if (degreeIndex === 1 || degreeIndex === 2 || degreeIndex === 5) {
        return { rootPc: notePc, quality: "minor" };
      } else {
        return { rootPc: notePc, quality: "major" };
      }
    }

    function degreeToSemitoneOffset(degreeNum, quality) {
      const thirdInterval = quality === "minor" || quality === "dim" ? 3 : 4;
      const fifthInterval = quality === "dim" ? 6 : 7;

      switch (Number(degreeNum)) {
        case 1: return 0;
        case 2: return 2;
        case 3: return thirdInterval;
        case 4: return 5;
        case 5: return fifthInterval;
        case 6: return 9;
        case 7: return 11;
        case 8: return 12;
        case 9: return 14;
        case 10: return 12 + thirdInterval;
        default: return 0;
      }
    }

    function rebuildActiveNotes() {
      if (!songData) return;

      const generatedNotes = [];

      songData.rawRightNotes.forEach((n) => {
        generatedNotes.push({
          midi: n.midi + transposeSemitones,
          startQuarter: n.startQuarter,
          durationQuarter: n.durationQuarter,
          hand: "rh",
          lyric: n.lyric
        });
      });

      if (songData.isTwoHandPianoSheet) {
        songData.rawLeftNotes.forEach((n) => {
          generatedNotes.push({
            midi: n.midi + transposeSemitones,
            startQuarter: n.startQuarter,
            durationQuarter: n.durationQuarter,
            hand: "lh"
          });
        });
      } else {
        const patternObj = patterns.find((p) => p.id === currentPatternId) || patterns[0];
        const patternDegrees = patternObj ? patternObj.notes : [1, 3, 5, 3];
        const beatStepQuarter = songData.beatType === 8 ? 0.5 : (4 / songData.beatType);

        let lastChord = {
          rootPc: FIFTHS_TO_TONIC_PC[String(songData.fifths)] ?? 0,
          quality: "major"
        };

        songData.measuresInfo.forEach((m) => {
          const rhInMeasure = songData.rawRightNotes.filter(
            (n) => n.startQuarter >= m.startQuarter - 0.02 && n.startQuarter < m.startQuarter + m.durationQuarter - 0.02
          );

          if (rhInMeasure.length === 0 && m.harmonies.length === 0) return;

          let chordSegments = [];
          if (songData.hasExplicitChords && m.harmonies.length > 0) {
            m.harmonies.forEach((h, idx) => {
              const segStart = h.startQuarter;
              const segEnd = idx + 1 < m.harmonies.length
                ? m.harmonies[idx + 1].startQuarter
                : m.startQuarter + m.durationQuarter;
              chordSegments.push({
                startQuarter: segStart,
                endQuarter: segEnd,
                rootPc: h.rootPc,
                quality: h.quality
              });
              lastChord = { rootPc: h.rootPc, quality: h.quality };
            });
          } else {
            if (rhInMeasure.length > 0) {
              const firstMelodyNote = rhInMeasure[0];
              lastChord = getDiatonicChordFromFirstNote(firstMelodyNote.midi, songData.fifths);
            }
            chordSegments.push({
              startQuarter: m.startQuarter,
              endQuarter: m.startQuarter + m.durationQuarter,
              rootPc: lastChord.rootPc,
              quality: lastChord.quality
            });
          }

          chordSegments.forEach((seg) => {
            let baseRootMidi = 48 + seg.rootPc + transposeSemitones;
            while (baseRootMidi > 59) baseRootMidi -= 12;
            while (baseRootMidi < 45) baseRootMidi += 12;

            const numBeatsInSeg = Math.floor((seg.endQuarter - seg.startQuarter + 0.01) / beatStepQuarter);
            if (numBeatsInSeg <= 0) return;

            const trialNotes = [];
            for (let b = 0; b < numBeatsInSeg; b++) {
              const degree = patternDegrees[b % patternDegrees.length];
              const semitoneOffset = degreeToSemitoneOffset(degree, seg.quality);
              const noteStartQ = seg.startQuarter + b * beatStepQuarter;
              trialNotes.push({
                midi: baseRootMidi + semitoneOffset,
                startQuarter: noteStartQ,
                durationQuarter: beatStepQuarter * 0.92
              });
            }

            let hasCollision = false;
            for (const lhN of trialNotes) {
              const activeRhAtBeat = generatedNotes.filter(
                (rhN) =>
                  rhN.hand === "rh" &&
                  rhN.startQuarter < lhN.startQuarter + lhN.durationQuarter - 0.02 &&
                  rhN.startQuarter + rhN.durationQuarter > lhN.startQuarter + 0.02
              );
              for (const rhN of activeRhAtBeat) {
                if (lhN.midi >= rhN.midi - 1) {
                  hasCollision = true;
                  break;
                }
              }
              if (hasCollision) break;
            }

            const octaveShift = hasCollision ? -12 : 0;
            trialNotes.forEach((lhN) => {
              generatedNotes.push({
                midi: lhN.midi + octaveShift,
                startQuarter: lhN.startQuarter,
                durationQuarter: lhN.durationQuarter,
                hand: "lh"
              });
            });
          });
        });
      }

      activeNotes = generatedNotes.sort((a, b) => a.startQuarter - b.startQuarter);
    }

    /********************************************************************
     * 11. VÒNG LẶP PHÁT NHẠC & ĐẾM NHỊP CHỜ (LOOP + COUNT-IN ENGINE)
     ********************************************************************/
    function getOrderedSelectedPhrases() {
      const indices = Array.from(selectedPhraseIndices).sort((a, b) => a - b);
      return indices.map((i) => phrases[i]).filter(Boolean);
    }

    function resetCursorToFirstSelectedPhrase() {
      const selected = getOrderedSelectedPhrases();
      if (selected.length > 0) {
        currentBeat = selected[0].startQuarter;
      } else {
        currentBeat = 0;
      }
      triggeredNotesSet.clear();
      isCountingIn = false;
      document.getElementById("countInOverlay").style.display = "none";
    }

    function startCountInBeforeNextLoop(nextTargetQuarter) {
      if (countInBeatsSetting <= 0) {
        currentBeat = nextTargetQuarter;
        triggeredNotesSet.clear();
        return;
      }
      isCountingIn = true;
      countInRemainingBeats = countInBeatsSetting;
      lastCountInInt = -1;
      currentBeat = nextTargetQuarter;
      triggeredNotesSet.clear();
      const overlay = document.getElementById("countInOverlay");
      overlay.style.display = "block";
    }

    function updatePlayback(deltaSeconds) {
      if (!isPlaying || !songData) return;

      const quartersPerSecond = currentBpm / 60;
      const deltaQuarters = deltaSeconds * quartersPerSecond;

      if (isCountingIn) {
        countInRemainingBeats -= deltaQuarters;
        const ceilBeat = Math.ceil(countInRemainingBeats);
        if (ceilBeat !== lastCountInInt && ceilBeat > 0) {
          lastCountInInt = ceilBeat;
          document.getElementById("countInOverlay").textContent = `Nhịp chờ: ${ceilBeat}`;
          playMetronomeTick(ceilBeat === countInBeatsSetting);
        }
        if (countInRemainingBeats <= 0) {
          isCountingIn = false;
          document.getElementById("countInOverlay").style.display = "none";
        }
        return;
      }

      const prevBeat = currentBeat;
      currentBeat += deltaQuarters;

      activeNotes.forEach((n, idx) => {
        if (n.startQuarter >= prevBeat - 0.02 && n.startQuarter <= currentBeat) {
          if (!triggeredNotesSet.has(idx)) {
            triggeredNotesSet.add(idx);
            const durSec = n.durationQuarter / quartersPerSecond;
            playPianoNote(n.midi, durSec, n.hand);
          }
        }
      });

      const selected = getOrderedSelectedPhrases();
      if (selected.length > 0) {
        let currentPhrasePos = selected.findIndex(
          (p) => prevBeat >= p.startQuarter - 0.05 && prevBeat <= p.endQuarter + 0.05
        );

        if (currentPhrasePos === -1) {
          currentPhrasePos = 0;
        }

        const activePhrase = selected[currentPhrasePos];
        if (currentBeat >= activePhrase.endQuarter) {
          if (currentPhrasePos + 1 < selected.length) {
            const nextPhrase = selected[currentPhrasePos + 1];
            if (Math.abs(nextPhrase.startQuarter - activePhrase.endQuarter) > 0.1) {
              currentBeat = nextPhrase.startQuarter;
              triggeredNotesSet.clear();
            }
          } else {
            startCountInBeforeNextLoop(selected[0].startQuarter);
          }
        }
      } else if (currentBeat >= songData.totalQuarters) {
        startCountInBeforeNextLoop(0);
      }
    }

    function togglePlayPause() {
      ensureAudioContext();
      isPlaying = !isPlaying;
      const btn = document.getElementById("btnPlayPause");
      if (isPlaying) {
        btn.textContent = "⏸ Tạm dừng";
        btn.classList.add("playing");
      } else {
        btn.textContent = "▶ Tiếp tục";
        btn.classList.remove("playing");
      }
    }

    function stopPlayback() {
      isPlaying = false;
      isCountingIn = false;
      document.getElementById("countInOverlay").style.display = "none";
      const btn = document.getElementById("btnPlayPause");
      btn.textContent = "▶ Bắt đầu";
      btn.classList.remove("playing");
    }

    /********************************************************************
     * 12. VẼ GIAO DIỆN NỐT RƠI SYNTHESIA & BÀN PHÍM PIANO (CANVAS)
     ********************************************************************/
    const canvas = document.getElementById("pianoCanvas");
    const ctx = canvas.getContext("2d");

    const MIN_MIDI = 36;
    const MAX_MIDI = 96;

    function isBlackKey(midi) {
      const pc = ((midi % 12) + 12) % 12;
      return [1, 3, 6, 8, 10].includes(pc);
    }

    function getNoteLabel(midi) {
      const pc = ((midi % 12) + 12) % 12;
      if (noteLabelMode === "solfege") {
        return SEMITONE_TO_SOLFEGE[pc];
      }
      return SEMITONE_TO_LETTER[pc];
    }

    function resizeCanvas() {
      const stage = document.getElementById("stageContainer");
      const dpr = window.devicePixelRatio || 1;
      canvas.width = stage.clientWidth * dpr;
      canvas.height = stage.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function drawSynthesiaStage(timestamp) {
      if (!lastFrameTime) lastFrameTime = timestamp;
      const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
      lastFrameTime = timestamp;

      updatePlayback(dt);

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const keyboardHeight = Math.max(120, Math.min(155, height * 0.23));
      const hitLineY = height - keyboardHeight;

      // Xóa sạch khung vẽ trước mỗi frame để không bao giờ bị bóng/lặp 2 dòng phím
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#EFE4D2";
      ctx.fillRect(0, 0, width, height);

      const whiteKeys = [];
      for (let m = MIN_MIDI; m <= MAX_MIDI; m++) {
        if (!isBlackKey(m)) whiteKeys.push(m);
      }
      const whiteKeyWidth = width / whiteKeys.length;
      const keyGeometry = {};

      whiteKeys.forEach((m, idx) => {
        keyGeometry[m] = {
          x: idx * whiteKeyWidth,
          w: whiteKeyWidth,
          isBlack: false
        };
      });

      for (let m = MIN_MIDI; m <= MAX_MIDI; m++) {
        if (isBlackKey(m)) {
          const prevWhite = keyGeometry[m - 1];
          if (prevWhite) {
            const bw = whiteKeyWidth * 0.64;
            keyGeometry[m] = {
              x: prevWhite.x + whiteKeyWidth - bw / 2,
              w: bw,
              isBlack: true
            };
          }
        }
      }

      // Kẻ các đường dọc mờ phân chia quãng tám
      ctx.strokeStyle = "rgba(109, 76, 65, 0.16)";
      ctx.lineWidth = 1;
      whiteKeys.forEach((m) => {
        if (m % 12 === 0) {
          const kx = keyGeometry[m].x;
          ctx.beginPath();
          ctx.moveTo(kx, 0);
          ctx.lineTo(kx, hitLineY);
          ctx.stroke();
        }
      });

      const visibleQuarters = 8;
      const pixelsPerQuarter = hitLineY / visibleQuarters;

      // Vẽ vạch ngang phân cách từng ô nhịp
      if (songData) {
        ctx.strokeStyle = "rgba(109, 76, 65, 0.22)";
        ctx.lineWidth = 1.5;
        songData.measuresInfo.forEach((m) => {
          const dy = hitLineY - (m.startQuarter - currentBeat) * pixelsPerQuarter;
          if (dy >= 0 && dy <= hitLineY) {
            ctx.beginPath();
            ctx.moveTo(0, dy);
            ctx.lineTo(width, dy);
            ctx.stroke();

            ctx.fillStyle = "rgba(109, 76, 65, 0.65)";
            ctx.font = "600 13px Lexend";
            ctx.textAlign = "left";
            ctx.fillText(`Ô ${m.index + 1}`, 8, dy - 4);
          }
        });
      }

      // 2. Vẽ các thanh nốt rơi (Synthesia Bars) và danh sách chữ Lyric vẽ bên cạnh
      const pressedKeysMap = new Map();
      const lyricsToDraw = [];

      activeNotes.forEach((n) => {
        if (handMode === "rh" && n.hand === "lh") return;
        if (handMode === "lh" && n.hand === "rh") return;

        const geom = keyGeometry[n.midi];
        if (!geom) return;

        const noteBottomY = hitLineY - (n.startQuarter - currentBeat) * pixelsPerQuarter;
        const noteHeight = Math.max(20, n.durationQuarter * pixelsPerQuarter - 3);
        const noteTopY = noteBottomY - noteHeight;

        if (!isCountingIn && currentBeat >= n.startQuarter && currentBeat <= n.startQuarter + n.durationQuarter) {
          pressedKeysMap.set(n.midi, n.hand);
        }

        if (noteBottomY < 0 || noteTopY > hitLineY) return;

        const barColor = n.hand === "rh" ? "#1F7A68" : "#D97724";
        const borderColor = n.hand === "rh" ? "#114B3E" : "#9E500F";

        const pad = geom.isBlack ? 1 : 2;
        const bx = geom.x + pad;
        const bw = geom.w - pad * 2;
        const clampedTop = Math.max(0, noteTopY);
        const clampedBottom = Math.min(hitLineY, noteBottomY);
        const clampedH = Math.max(0, clampedBottom - clampedTop);

        if (clampedH > 2) {
          ctx.fillStyle = barColor;
          ctx.strokeStyle = borderColor;
          ctx.lineWidth = 1.5;

          ctx.beginPath();
          ctx.roundRect(bx, clampedTop, bw, clampedH, 6);
          ctx.fill();
          ctx.stroke();

          // In tên nốt (Đô, Rê, Mi...) bên trong thanh nốt
          if (clampedH >= 15) {
            ctx.fillStyle = "#FFFDF9";
            ctx.font = "700 13px Lexend";
            ctx.textAlign = "center";
            const label = getNoteLabel(n.midi);
            ctx.fillText(label, bx + bw / 2, clampedBottom - 5);
          }

          // Lưu tọa độ lyric để vẽ nổi bật kế bên phải nốt nhạc (không bao giờ bị mất khi nốt ngắn)
          if (n.lyric && n.hand === "rh") {
            lyricsToDraw.push({
              text: n.lyric,
              x: bx + bw + 5,
              y: clampedBottom - Math.min(10, clampedH / 2 - 4)
            });
          }
        }
      });

      // Vẽ toàn bộ chữ Lyric kế bên nốt nhạc (lớp trên cùng của vùng nốt rơi)
      lyricsToDraw.forEach((item) => {
        ctx.font = "700 15px Lexend";
        ctx.textAlign = "left";
        const textWidth = ctx.measureText(item.text).width;

        // Nền kem mờ nhỏ dưới chữ giúp đọc cực rõ ngay cả khi các nốt gần nhau
        ctx.fillStyle = "rgba(253, 249, 241, 0.88)";
        ctx.strokeStyle = "rgba(141, 78, 42, 0.35)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(item.x - 3, item.y - 14, textWidth + 6, 19, 4);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#3E2723";
        ctx.fillText(item.text, item.x, item.y);
      });

      // 3. Vẽ đường viền tiếp xúc bàn phím
      ctx.fillStyle = "#5D4037";
      ctx.fillRect(0, hitLineY - 3, width, 4);

      // 4. Vẽ các phím trắng Piano (Chỉ vẽ đúng 1 dòng chữ tên nốt ở chân phím)
      whiteKeys.forEach((m) => {
        const g = keyGeometry[m];
        const activeHand = pressedKeysMap.get(m);

        if (activeHand === "rh") {
          ctx.fillStyle = "#4DB6AC";
        } else if (activeHand === "lh") {
          ctx.fillStyle = "#FFB74D";
        } else {
          ctx.fillStyle = "#FFFDF9";
        }

        ctx.strokeStyle = "#8D6E63";
        ctx.lineWidth = 1;
        ctx.fillRect(g.x, hitLineY, g.w, keyboardHeight);
        ctx.strokeRect(g.x, hitLineY, g.w, keyboardHeight);

        ctx.fillStyle = activeHand ? "#212121" : "#5D4037";
        ctx.font = m % 12 === 0 ? "700 13px Lexend" : "500 12px Lexend";
        ctx.textAlign = "center";
        const octaveNum = Math.floor(m / 12) - 1;
        const noteText = m % 12 === 0 ? `${getNoteLabel(m)}${octaveNum}` : getNoteLabel(m);
        ctx.fillText(noteText, g.x + g.w / 2, hitLineY + keyboardHeight - 14);
      });

      // 5. Vẽ các phím đen Piano
      for (let m = MIN_MIDI; m <= MAX_MIDI; m++) {
        if (isBlackKey(m)) {
          const g = keyGeometry[m];
          if (!g) continue;
          const activeHand = pressedKeysMap.get(m);

          if (activeHand === "rh") {
            ctx.fillStyle = "#00897B";
          } else if (activeHand === "lh") {
            ctx.fillStyle = "#F57C00";
          } else {
            ctx.fillStyle = "#3E2723";
          }

          const bh = keyboardHeight * 0.62;
          ctx.fillRect(g.x, hitLineY, g.w, bh);
          ctx.strokeStyle = "#271815";
          ctx.strokeRect(g.x, hitLineY, g.w, bh);
        }
      }

      requestAnimationFrame(drawSynthesiaStage);
    }

    /********************************************************************
     * 13. SỰ KIỆN NÚT BẤM, PHÍM SPACE & HIỂN THỊ TONE
     ********************************************************************/
    function updateTempoDisplay() {
      document.getElementById("tempoDisplay").textContent = `${currentBpm} BPM`;
    }

    function updateTransposeDisplay() {
      const el = document.getElementById("transposeDisplay");
      if (!songData) {
        el.textContent = "Tone: C";
        return;
      }
      const origTonicPc = FIFTHS_TO_TONIC_PC[String(songData.fifths)] ?? 0;
      const currentTonicPc = ((origTonicPc + transposeSemitones) % 12 + 12) % 12;
      const currentToneName = SEMITONE_TO_LETTER[currentTonicPc];

      if (transposeSemitones === 0) {
        el.textContent = `Tone: ${currentToneName} (Gốc)`;
      } else {
        const sign = transposeSemitones > 0 ? `+${transposeSemitones}` : `${transposeSemitones}`;
        el.textContent = `Tone: ${currentToneName} (${sign})`;
      }
    }

    const countInInput = document.getElementById("countInInput");
    countInInput.value = countInBeatsSetting;
    function updateCountInSetting(val) {
      countInBeatsSetting = Math.max(0, Math.min(16, parseInt(val || "0", 10)));
      countInInput.value = countInBeatsSetting;
      localStorage.setItem("piano_countIn", String(countInBeatsSetting));
    }
    countInInput.addEventListener("change", (e) => updateCountInSetting(e.target.value));
    document.getElementById("btnCountInMinus").addEventListener("click", () => updateCountInSetting(countInBeatsSetting - 1));
    document.getElementById("btnCountInPlus").addEventListener("click", () => updateCountInSetting(countInBeatsSetting + 1));

    // Cài đặt Kiểu tên nốt
    const noteLabelSelect = document.getElementById("noteLabelSelect");
    noteLabelSelect.value = noteLabelMode;
    noteLabelSelect.addEventListener("change", (e) => {
      noteLabelMode = e.target.value;
      localStorage.setItem("piano_noteLabel", noteLabelMode);
    });

    // Thêm quy tắc rải hợp âm mới
    document.getElementById("btnAddPattern").addEventListener("click", () => {
      const rawNotes = document.getElementById("newPatternNotes").value.trim();
      const rawMeters = document.getElementById("newPatternMeters").value.trim();

      const parsedNotes = rawNotes
        .split(/[\s,\-–]+/)
        .map((x) => parseInt(x, 10))
        .filter((x) => !isNaN(x) && x >= 1 && x <= 12);

      if (parsedNotes.length < 2) {
        alert("Vui lòng nhập ít nhất 2 nốt hợp lệ (ví dụ: 1-5-8-5-3-5-8-5)!");
        return;
      }

      const meters = rawMeters
        ? rawMeters.split(/[\s,]+/).filter(Boolean)
        : [];

      const newId = "custom_" + Date.now();
      const displaySeq = parsedNotes.join(" – ");
      patterns.push({
        id: newId,
        name: `Tự tạo: ${displaySeq}`,
        notes: parsedNotes,
        suggestedMeters: meters,
        hint: meters.length > 0 ? `Gợi ý: Nhịp ${meters.join(", ")}` : "Tự chọn"
      });

      currentPatternId = newId;
      document.getElementById("newPatternNotes").value = "";
      document.getElementById("newPatternMeters").value = "";
      savePatternsToLocal();
    });

    // Khởi chạy ứng dụng
    (async function bootstrap() {
      await loadPatterns();
      await initSongList();
      requestAnimationFrame(drawSynthesiaStage);
    })();
  </script>
</body>
</html>
